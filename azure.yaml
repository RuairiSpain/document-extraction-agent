# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: document-extraction-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: gpt-5.4-pro
        model:
          format: OpenAI
          name: gpt-5.4-pro
          version: '2026-03-05'
        sku:
          name: GlobalStandard
          capacity: 10
      - name: mistral-ocr-4-0
        model:
          format: Mistral AI
          name: mistral-ocr-4-0
          version: '1'
        sku:
          name: GlobalStandard
          capacity: 1
  document-extraction-agent:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Invocations Protocol
        - Bring Your Own
        - Python
        - Document Extraction
    project: src
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: document-extraction-agent
    displayName: Document Extraction and Validation
    description: Extracts paragraphs and tables as structured JSON from PDFs with GPT-5.4 Mini or Pro, and optionally scores agreement against an independent Mistral OCR 4 extraction.
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      EXTRACTION_MODEL_MINI: gpt-5.4-mini
      EXTRACTION_MODEL_PRO: gpt-5.4-pro
      SECONDARY_EXTRACTION_MODEL: mistral-ocr-4-0
      LOG_LEVEL: INFO
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
