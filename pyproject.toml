[project]
name = "document-extraction-agent"
version = "1.0.0"
description = "Microsoft Foundry hosted agent: GPT-5.4 PDF extraction with optional Mistral OCR 4 agreement evaluation."
requires-python = ">=3.13"
# Runtime pins. src/requirements.txt mirrors these for the Foundry code deploy.
dependencies = [
    "aiohttp==3.13.5",
    "azure-ai-agentserver-core==2.1.0",
    "azure-ai-agentserver-invocations==1.1.0",
    "azure-ai-projects==2.0.1",
    "azure-identity==1.25.3",
    "httpx==0.28.1",
    "openai==2.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pypdf==6.21.1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "reportlab>=5,<6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: live Microsoft Foundry tests; run with `pytest -m integration`"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
